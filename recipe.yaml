schema_version: 1

# Conda recipe for dains_perception.
# Build with:
#   rattler-build build --recipe recipe.yaml --channel conda-forge

context:
  # Keep in sync with the version in pyproject.toml.
  version: "0.1.0"

package:
  name: dains_perception
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  # Pure Python package.
  noarch: python
  script:
    content:
      - python -m pip install --no-deps --no-build-isolation . -vv

requirements:
  host:
    - python >=3.10
    - pip
    # Build backend.
    - hatchling
  run:
    - python >=3.10

    # Install groundingdino-py-cuda separately on GPU hosts if needed.
    - groundingdino-py >=0.4.1

    # Runtime dependencies.
    - pytorch >=2.1.0
    - torchvision
    - numpy >=1.26.2
    - opencv
    - timm
    - transformers >=4.49.0
    - supervision >=0.22.0
    - lap
    - pandas
    - motmetrics
    - accelerate
    - einops
    - addict
    - yapf
    - pycocotools

    # PyPI-only runtime dependencies:
    #   pip install cython_bbox clip

tests:
  - python:
      imports:
        - eval
        - tracker
        - utils
      # Disabled because motmetrics reports its test extras as required metadata.
      pip_check: false

about:
  summary: Text-guided multi-object tracking with open-vocabulary detection
  description: |
    Extends GroundingDINO into a text-guided multi-object tracking pipeline:
    open-vocabulary detection, ByteTrack/CLIP tracking, a per-frame scene graph
    of spatial relations, motion, colour and size, and colour re-identification
    across brief occlusions.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/azzy13/dains_perception
  repository: https://github.com/azzy13/dains_perception
